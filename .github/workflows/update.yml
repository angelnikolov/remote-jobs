# Goes in the public jobs repo as .github/workflows/update.yml, next to
# generate.mjs at the repo root. Rebuilds the tables once a day and commits
# only when they changed.
name: Update job tables

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node generate.mjs .
        env:
          JOBS_REPO_KEY: ${{ secrets.JOBS_REPO_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md JUNIOR.md
          git diff --cached --quiet || git commit -m "Update job tables"
          git push
